<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS SAA-C03 Prep</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore path encoded by 404.html, keeping the /AWS-SAA-C03-Prep base intact
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        var h = params.get('h');
        if (p !== null) {
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(
            null, null,
            base + '/' + decodeURIComponent(p) + (h ? '#' + decodeURIComponent(h) : '')
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
