<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AWS SAA-C03 Prep</title>
    <script>
      // GitHub Pages SPA redirect: encode the path into the query string so
      // index.html can pick it up and hand it to React Router.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
        '#' + l.hash.slice(1)
      );
    </script>
  </head>
  <body></body>
</html>
